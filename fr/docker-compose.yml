services:
  db:
    image: postgres:16-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${DOCKER_ENV:-development}
    container_name: backend
    env_file: .env
    environment:
      DB_HOST: db
      POSTGRES_URL_NAME: postgresql+psycopg2://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT}/${DB_NAME}
    volumes:
      - ./backend:/app:cached   # hot reload in dev (harmless in prod)
      - ./backend/config.toml:/app/config.toml:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "if [ '${DOCKER_ENV}' = 'development' ]; then
        uvicorn app:app --reload --host 0.0.0.0 --port 8000;
      else
        uvicorn app:app --host 0.0.0.0 --port 8000;
      fi"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${DOCKER_ENV:-development}
    container_name: frontend
    env_file: .env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app:cached   # hot reload in dev
      - /app/node_modules
    depends_on:
      - backend
    ports:
      - "3000:3000"
    command: >
      sh -c "if [ '${DOCKER_ENV}' = 'development' ]; then
        npm start;
      else
        npm run build && npx serve -s build -l 3000;
      fi"

  nginx:
    build:
      context: .                      # 👈 send whole project to Docker
      dockerfile: ./nginx/Dockerfile  # 👈 explicitly point to nginx Dockerfile
    container_name: nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  db_data:
